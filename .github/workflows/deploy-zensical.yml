
# ============================================================
# Project 05: Documentation and Governance App Deployment
# ============================================================
#
# Publishes:
#   /            Zensical project documentation
#   /governance/ Healthcare Metadata Governance Drift Monitor
#
# The instructor's original Marimo application remains in
# src/cintel/app.py but is not published to GitHub Pages.
#
# Trigger:
#   Push to main or manual workflow dispatch
#
# ============================================================

name: Docs and Governance App Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  UV_FROZEN: "1"

jobs:
  docs:
    name: Deploy Documentation and Governance App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------
      # A) Prepare project environment
      # ------------------------------------------------------

      - name: A1) Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: A2) Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: A3) Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: A4) Install project Python
        run: uv python install

      - name: A5) Install locked dependencies
        run: uv sync --frozen

      - name: A6) Show tool versions
        run: |
          uv --version
          uv run python --version
          uv run python -m zensical --version
          uv run marimo --version

      # ------------------------------------------------------
      # B) Build Zensical documentation
      # ------------------------------------------------------

      - name: B1) Build documentation
        run: |
          if [ ! -f "zensical.toml" ]; then
            echo "Missing zensical.toml"
            exit 1
          fi

          uv run python -m zensical build

      # ------------------------------------------------------
      # C) Export Healthcare Governance Marimo application
      # ------------------------------------------------------

      - name: C1) Export governance application
        run: |
          mkdir -p site/governance

          uv run marimo export html-wasm \
            src/cintel/governance_app.py \
            -o site/governance/index.html \
            --mode run \
            --force

      - name: C2) Copy governance data
        run: |
          mkdir -p site/governance/public

          cp data/governance_metrics_timeseries.csv \
            site/governance/public/governance_metrics_timeseries.csv

      # ------------------------------------------------------
      # D) Verify generated website
      # ------------------------------------------------------

      - name: D1) Verify output files
        run: |
          test -f site/index.html
          test -f site/governance/index.html
          test -f site/governance/public/governance_metrics_timeseries.csv

          echo "Documentation and governance application are ready."

      # ------------------------------------------------------
      # E) Publish to GitHub Pages
      # ------------------------------------------------------

      - name: E1) Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: E2) Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
